
# A generic, single database configuration.

[alembic]
# path to migration scripts.
script_location = %(here)s/migrations
prepend_sys_path = .

# IMPORTANT: Replace this with your actual Supabase PostgreSQL connection string.
# It can be found in your Supabase project settings under Database > Connection string.
# Make sure to use the URI for a direct connection, not the one for connection pooling.
sqlalchemy.url = postgresql+asyncpg://postgres:[YOUR-PASSWORD]@[YOUR-HOST]:5432/postgres


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
